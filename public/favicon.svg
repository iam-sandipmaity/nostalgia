<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Rounded Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#2a1810" stroke="#d97706" stroke-width="2.5" />
  
  <!-- Cassette Body -->
  <rect x="8" y="14" width="48" height="36" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
  
  <!-- Retro Tape Label Sticker -->
  <rect x="11" y="17" width="42" height="18" rx="2" fill="#fef3c7" />
  <line x1="11" y1="21" x2="53" y2="21" stroke="#dc2626" stroke-width="1.5" />
  <line x1="15" y1="28" x2="49" y2="28" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="2 1" />

  <!-- Tape Window -->
  <rect x="14" y="37" width="36" height="10" rx="3" fill="#18181b" stroke="#71717a" stroke-width="1" />

  <!-- Left Reel -->
  <circle cx="23" cy="42" r="3.5" fill="#fef3c7" stroke="#dc2626" stroke-width="1" />
  <circle cx="23" cy="42" r="1" fill="#18181b" />

  <!-- Right Reel -->
  <circle cx="41" cy="42" r="3.5" fill="#fef3c7" stroke="#dc2626" stroke-width="1" />
  <circle cx="41" cy="42" r="1" fill="#18181b" />

  <!-- Connecting Tape Line -->
  <line x1="26.5" y1="42" x2="37.5" y2="42" stroke="#d97706" stroke-width="1.5" />

  <!-- Vintage Gloss Highlight -->
  <path d="M 4 16 A 14 14 0 0 1 18 4 L 40 4 Z" fill="#ffffff" fill-opacity="0.1" />
</svg>